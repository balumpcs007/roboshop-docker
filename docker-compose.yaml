services:
  mongodb:
    image: mongodb:v1
    container_name: mongodb
    volumes:
      - mongodb:/data/db
  catalogue:
    build:
      context: ./catalogue
      dockerfile: Dockerfile
    image: catalogue:v1
    container_name: catalogu
    depends_on:
    - mongodb
  mysql:
    image: mysql:v1
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql
  redis:
    image: redis:7
    container_name: redis
    volumes:
    - redis:/data
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes:
    - rabbitmq:/var/lib/rabbitmq
  user:
    build:
      context: ./user
    image: user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb
  cart:
    build:
      context: ./cart
    image: cart:v1
    container_name: cart
    depends_on:
    - redis
    - catalogue
  shipping:
    build:
      context: ./shipping
    image: shipping:v1
    container_name: shipping
    depends_on:
    - cart
    - mysql
  payment:
    build:
      context: ./payment
    image: payment:v1
    container_name: payment
    depends_on:
    - cart
    - user
    - rabbitmq
  frontend:
    build:
      context: ./frontend
    image: frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment

networks:
  default:
    driver: bridge
    name: roboshop
    external: false
volumes:
  mongodb:
  mysql:
  redis:
  rabbitmq: